<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oops! Page not found</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oops! Page not found" />
    <meta
      property="og:description"
      content="The official wiki for The Majestic Bees."
    />
    <meta
      property="og:image"
      content="https://spookyz10.github.io/MajesticBeesWiki/images/ui/site-logo.png"
    />
    <meta property="og:image:alt" content="The Majestic Bees Wiki logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oops! Page not found" />
    <meta
      name="twitter:description"
      content="The official wiki for The Majestic Bees."
    />
    <meta
      name="twitter:image"
      content="https://spookyz10.github.io/MajesticBeesWiki/images/ui/site-logo.png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/404.css" />
    <link rel="icon" type="image/png" href="images/ui/fav-icon.png" />
  </head>
  <body>
    <div id="sidebar-container"></div>
    <div class="main">
      <div class="content">
        <div class="not-found-wrap">
          <div class="not-found-title">🐝 Oops! This page does not exist.</div>
          <div class="not-found-subtitle">
            Looks like this bee flew to another field.
          </div>
          <div class="not-found-path" id="missing-path"></div>
          <button class="not-found-back" id="go-back-btn">Go Back</button>
        </div>
      </div>
    </div>

    <script defer src="js/load-sidebar.js"></script>
    <script>
      document.getElementById("missing-path").textContent =
        window.location.pathname;

      document.getElementById("go-back-btn").addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
