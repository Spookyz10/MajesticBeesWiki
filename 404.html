<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oops! Página não encontrada</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/ui/fav-icon.png" />
    <style>
      .not-found-wrap {
        max-width: 620px;
        margin: 80px auto;
        padding: 28px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .not-found-title {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .not-found-subtitle {
        opacity: 0.92;
        margin-bottom: 22px;
      }

      .not-found-path {
        font-family: monospace;
        opacity: 0.78;
        margin-bottom: 22px;
        word-break: break-all;
      }

      .not-found-back {
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        background: #ffcf5b;
        color: #2f2100;
      }

      .not-found-back:hover {
        filter: brightness(1.03);
      }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>
    <div class="main">
      <div class="content">
        <div class="not-found-wrap">
          <div class="not-found-title">🐝 Oops! Essa página não existe.</div>
          <div class="not-found-subtitle">
            Parece que essa abelha voou para outro campo.
          </div>
          <div class="not-found-path" id="missing-path"></div>
          <button class="not-found-back" id="go-back-btn">Voltar</button>
        </div>
      </div>
    </div>

    <script defer src="js/load-sidebar.js"></script>
    <script>
      document.getElementById("missing-path").textContent = window.location.pathname;

      document.getElementById("go-back-btn").addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
