<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter Shop</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/general-shop.css" />
    <link rel="stylesheet" href="pagefind/pagefind-ui.css" />
    <script defer src="pagefind/pagefind-ui.js"></script>
    <script defer src="js/search.js"></script>
    <script defer src="js/shop-detail.js"></script>
    <script defer src="js/load-sidebar.js"></script>
    <link rel="icon" type="image/png" href="images/ui/fav-icon.png" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main" data-pagefind-body>
      <div class="topbar">
        <div id="search"></div>
      </div>

      <div class="content mw-parser-output">
        <div style="text-align: center; padding: 30px 0 10px">
          <div id="shop-title" class="hero-title">Starter Shop</div>
        </div>

        <div class="shop-shell">
          <div class="shop-hero">
            <div class="shop-summary">
              <h2>About the Shop</h2>
              <p id="shop-about">Loading shop description...</p>
            </div>
            <div class="shop-photo">
              <img
                id="shop-image"
                src="images/gear/starterShop/Shop.png"
                alt="Starter Shop"
              />
            </div>
          </div>

          <div id="shop-sections"></div>
        </div>
      </div>
    </div>
  </body>
</html>
