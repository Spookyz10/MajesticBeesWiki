<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Codes</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/ui/fav-icon.png" />

    <script defer src="js/wiki-search.js"></script>
    <script defer src="js/search.js"></script>
    <script defer src="js/codes.js"></script>
    <script defer src="js/load-sidebar.js"></script>
  </head>

  <body>
    <div id="sidebar-container"></div>

    <div class="main" data-pagefind-body>
      <div class="topbar">
        <div id="search"></div>
      </div>

      <div class="content">
        <div style="text-align: center; padding: 30px 0 10px">
          <div class="hero-title">Codes</div>
        </div>

        <div
          class="hero-description"
          style="
            max-width: 740px;
            margin: 6px auto 28px;
            padding: 0 20px;
            font-size: 1.05em;
          "
        >
          Redeem these codes in-game for free rewards. Codes expire after a
          limited time so make sure to check back often.
        </div>

        <hr />

        <h2 style="text-align: center">Active Codes</h2>
        <div id="active-codes" class="codes-list"></div>

        <hr />

        <h2 style="text-align: center">Expired Codes</h2>
        <div id="expired-codes" class="codes-list codes-list-expired"></div>
      </div>
    </div>
  </body>
</html>
