<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shop" />
    <meta
      property="og:description"
      content="The official wiki for The Majestic Bees."
    />
    <meta
      property="og:image"
      content="https://spookyz10.github.io/MajesticBeesWiki/images/ui/site-logo.png"
    />
    <meta property="og:image:alt" content="The Majestic Bees Wiki logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shop" />
    <meta
      name="twitter:description"
      content="The official wiki for The Majestic Bees."
    />
    <meta
      name="twitter:image"
      content="https://spookyz10.github.io/MajesticBeesWiki/images/ui/site-logo.png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/general-shop.css" />
    <script defer src="js/utils.js"></script>
    <script defer src="js/wiki-search.js"></script>
    <script defer src="js/search.js"></script>
    <script defer src="js/shop-detail.js"></script>
    <script defer src="js/load-sidebar.js"></script>
    <link rel="icon" type="image/png" href="images/ui/fav-icon.png" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main" data-pagefind-body>
      <div class="topbar">
        <div id="search"></div>
      </div>

      <div class="content mw-parser-output">
        <div style="text-align: center; padding: 30px 0 10px">
          <div id="shop-title" class="hero-title">Shop</div>
        </div>

        <div class="shop-shell">
          <div class="shop-hero">
            <div class="shop-summary">
              <h2>About the Shop</h2>
              <p id="shop-about">Loading shop description...</p>
            </div>
            <div class="shop-photo">
              <img
                id="shop-image"
                src="images/ui/site-logo.png"
                alt="Shop"
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>

          <div id="shop-sections"></div>
          <div
            id="other-shops"
            style="
              padding: 18px 20px;
              text-align: center;
              color: var(--gold-soft);
            "
          >
            <h3 style="margin: 0 0 6px; color: var(--gold)">Other Shops:</h3>
            <p id="other-shops-list" style="margin: 0">Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
